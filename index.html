<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e6fd9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Emmavengers House Adventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:900;color:#123a7a}
body{background:radial-gradient(circle at 50% 0%,#7cc8ff 0%,#2f86e8 55%,#1a56b8 100%);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.title{flex:1;text-align:center;color:#ffd21f;font-size:clamp(20px,4.2vw,40px);text-shadow:0 3px 0 #b8560a,0 6px 10px rgba(0,0,0,.3);letter-spacing:1px;line-height:1.05}
.btn{border:none;cursor:pointer;font:inherit;border-radius:22px;padding:12px 20px;font-size:clamp(18px,3vw,28px);background:linear-gradient(#ffe45c,#ffb800);color:#7a3a00;box-shadow:0 6px 0 #c77800,0 10px 16px rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c77800}
.back{min-width:64px;min-height:56px;font-size:30px;padding:6px 16px}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-size:clamp(16px,2.6vw,26px);box-shadow:0 4px 0 #c9d9f2;white-space:nowrap}
main{flex:1;overflow:auto;padding:10px 16px 20px;display:flex;flex-direction:column;align-items:center}
.hidden{display:none!important}
.grid{display:grid;gap:18px;width:100%;max-width:1100px;grid-template-columns:repeat(2,1fr)}
@media (orientation:landscape) and (min-width:800px){.grid.rooms{grid-template-columns:repeat(4,1fr)}}
.room{position:relative;border:6px solid #ffc400;border-radius:30px;background:linear-gradient(#fff8d6,#ffe9a0);padding:16px 10px;text-align:center;cursor:pointer;box-shadow:0 8px 0 #c98a00,0 14px 22px rgba(0,0,0,.25);font:inherit;color:#123a7a}
.room:active{transform:translateY(4px)}
.room .em{font-size:clamp(60px,11vw,110px);line-height:1.1}
.room .nm{font-size:clamp(22px,3.6vw,34px)}
.room .sub{font-size:clamp(14px,2.2vw,20px);color:#2f86e8}
.room.locked{filter:grayscale(.8);opacity:.75;cursor:default;box-shadow:0 8px 0 #888}
.room.locked .lock{position:absolute;top:8px;right:12px;font-size:34px}
.room.locked .sub{color:#666}
.heroimg{width:min(560px,90%);border-radius:24px;border:6px solid #ffc400;box-shadow:0 10px 20px rgba(0,0,0,.3);margin:6px 0 14px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;padding:18px}
.mode .em{font-size:clamp(44px,7vw,70px)}
.prompt{background:#fff;border:5px solid #ffc400;border-radius:28px;padding:12px 24px;font-size:clamp(24px,5vw,46px);text-align:center;margin:6px 0 16px;box-shadow:0 6px 0 #c98a00;max-width:1000px;display:flex;align-items:center;gap:12px;justify-content:center}
.say{font-size:28px;background:#2f86e8;color:#fff;border:none;border-radius:50%;width:54px;height:54px;flex:none;cursor:pointer;box-shadow:0 4px 0 #1a56b8}
.choices{display:grid;gap:16px;width:100%;max-width:1000px;grid-template-columns:repeat(3,1fr)}
@media (orientation:portrait){.choices.pics{grid-template-columns:repeat(2,1fr)}.choices.pics>*:nth-child(3){grid-column:1/3;justify-self:center;width:calc(50% - 8px)}}
.pic{border:6px solid #ffc400;border-radius:26px;overflow:hidden;background:#fff;cursor:pointer;padding:0;box-shadow:0 7px 0 #c98a00;aspect-ratio:1}
.pic img{width:100%;height:100%;display:block;object-fit:cover}
.opt{border:5px solid #ffc400;border-radius:24px;background:#fff;font:inherit;font-size:clamp(20px,3.4vw,32px);color:#123a7a;padding:20px 14px;cursor:pointer;box-shadow:0 6px 0 #c98a00;min-height:90px}
.ok{border-color:#2ecc40!important;box-shadow:0 6px 0 #1f8a2b!important;background:#e9ffe9!important}
.no{animation:shake .4s;opacity:.45}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.usewrap{display:flex;gap:18px;align-items:center;width:100%;max-width:1000px}
.usewrap .pic{width:min(300px,40vw);flex:none;cursor:default}
.opts{display:flex;flex-direction:column;gap:14px;flex:1}
@media (orientation:portrait){.usewrap{flex-direction:column}.usewrap .pic{width:min(280px,60vw)}.opts{width:100%}}
.roomsrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:1000px;margin-top:14px}
.drop{font:inherit;color:#123a7a;border:5px dashed #ffc400;border-radius:22px;background:rgba(255,255,255,.92);text-align:center;padding:10px 4px;font-size:clamp(14px,2.4vw,22px);cursor:pointer;min-height:110px}
.drop .em{font-size:clamp(34px,6vw,56px)}
.drop.hover{background:#fff3b0;border-style:solid}
.item{width:min(240px,46vw);aspect-ratio:1;border:6px solid #ffc400;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,18vw,150px);overflow:hidden;touch-action:none;cursor:grab;box-shadow:0 7px 0 #c98a00;position:relative;z-index:5}
.item img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.hint{color:#fff;font-size:clamp(14px,2.4vw,20px);margin-top:8px;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.slots{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.slot{width:clamp(48px,9vw,78px);height:clamp(58px,11vw,92px);border-radius:16px;background:#fff;border:4px solid #ffc400;font-size:clamp(32px,6vw,58px);display:flex;align-items:center;justify-content:center;color:#e8261c}
.letters{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:900px;margin-top:10px}
.letter{width:clamp(62px,11vw,96px);height:clamp(62px,11vw,96px);font-size:clamp(34px,6vw,56px);padding:0}
.letter.used{visibility:hidden}
.spellpic{width:min(220px,40vw);cursor:default}
.reward{text-align:center;color:#fff}
.reward h1{font-size:clamp(48px,10vw,96px);color:#ffd21f;margin:6px;text-shadow:0 4px 0 #b8560a,0 8px 14px rgba(0,0,0,.35)}
.bigstars{font-size:clamp(50px,10vw,90px);letter-spacing:6px}
.pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,40,100,.55);z-index:50}
.pop img{width:min(860px,94vw);border-radius:22px;border:6px solid #ffc400;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.pop .btn{margin-top:16px}
.burst{position:fixed;font-size:40px;pointer-events:none;z-index:60;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.progress{color:#fff;font-size:clamp(16px,2.6vw,24px)}

main.enter>*{animation:rise .45s cubic-bezier(.2,1.4,.4,1) both}
main.enter>*:nth-child(2){animation-delay:.06s}main.enter>*:nth-child(3){animation-delay:.12s}main.enter>*:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}}
.room,.pic,.opt,.drop{transition:transform .15s}
@media (hover:hover){.room:not(.locked):hover,.pic:hover,.opt:hover{transform:translateY(-4px) scale(1.02)}}
.ok{animation:bounce .5s}
@keyframes bounce{40%{transform:scale(1.12)}70%{transform:scale(.96)}}
.bar{width:min(700px,92%);height:22px;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden;border:3px solid #fff;margin-bottom:6px;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffe45c,#ffb800);border-radius:99px;transition:width .5s}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#123a7a}
#mascot{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:6px;z-index:40;pointer-events:none}
#mascot .face{font-size:clamp(44px,7vw,64px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));animation:bob 2s ease-in-out infinite}
#mascot .bub{background:#fff;border:4px solid #ffc400;border-radius:20px 20px 20px 4px;padding:8px 14px;font-size:clamp(14px,2.2vw,20px);max-width:min(60vw,360px);margin-bottom:30px;opacity:0;transform:scale(.6);transform-origin:bottom left;transition:.25s}
#mascot.talk .bub{opacity:1;transform:none}
#mascot.happy .face{animation:jump .6s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes jump{30%{transform:translateY(-30px) rotate(-10deg)}60%{transform:translateY(0) rotate(8deg)}}
main{padding-bottom:110px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.pop{animation:fadein .25s}.pop img{animation:rise .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes fadein{from{opacity:0}}
.bigstars span{display:inline-block;animation:starin .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars span:nth-child(2){animation-delay:.3s}.bigstars span:nth-child(3){animation-delay:.6s}
@keyframes starin{from{transform:scale(0) rotate(-180deg)}}
.title{font-family:inherit}

.reward .prompt{color:#123a7a}
.choices{max-width:min(1000px,125vh)}
#mascot .face{font-size:clamp(56px,9vw,96px)}
main{padding-bottom:150px}
@media (max-width:600px){#mascot .bub{margin-bottom:20px}main{padding-bottom:130px}}
@media (max-height:520px){
 header{padding:4px 10px}.title{font-size:22px}.back{min-height:44px}
 .prompt{font-size:22px;padding:6px 16px;margin:4px 0 8px}.say{width:42px;height:42px;font-size:20px}
 .choices{max-width:105vh}.usewrap .pic{width:44vh}.opt{min-height:56px;padding:10px;font-size:18px}
 .item{width:36vh;font-size:70px}.drop{min-height:70px;padding:4px}.drop .em{font-size:30px}
 .room{padding:8px}.room .em{font-size:52px}.mode{padding:10px}.spellpic{width:30vh}
 .slot{height:56px;width:46px;font-size:32px}.letter{width:58px;height:58px;font-size:32px}
 #mascot .face{font-size:46px}main{padding-bottom:80px}.bar{height:16px}.bar b{font-size:11px}
 .reward h1{font-size:40px}.bigstars{font-size:44px}.heroimg{width:min(360px,60%)}
 .pop img{width:auto;max-height:72vh;max-width:94vw}
}
main>*{flex-shrink:0}
@media (max-height:520px){.item{width:27vh}.spellpic{width:22vh}.hint{display:none}#mascot .bub{display:none}.roomsrow{margin-top:8px}}

/* full 16:9 cards, never cropped */
.pic{aspect-ratio:16/9}.pic img,.item img{object-fit:contain;background:#fff}
.item{aspect-ratio:16/9;width:min(420px,80vw)}
.usewrap .pic{width:min(460px,45vw)}.spellpic{width:min(420px,70vw)}
@media (orientation:portrait){
 .choices.pics{grid-template-columns:1fr;gap:10px;max-width:min(560px,100%)}
 .choices.pics>*:nth-child(3){grid-column:auto;width:auto}
 .usewrap .pic{width:min(460px,100%)}.spellpic{width:min(380px,92vw)}.item{width:min(380px,88vw)}
}
@media (orientation:portrait) and (max-width:600px){
 header{padding:6px 10px}.title{font-size:20px}.back{min-height:44px;min-width:52px;font-size:24px}.pill{font-size:15px;padding:6px 10px}
 .prompt{font-size:22px;padding:6px 14px;margin:4px 0 8px;border-width:4px}.say{width:42px;height:42px;font-size:20px}
 .bar{height:16px;margin-bottom:4px}.bar b{font-size:11px}main{padding:6px 10px 96px}
 .pic{border-width:4px;border-radius:18px;box-shadow:0 4px 0 #c98a00}
 .opt{min-height:60px;padding:12px;font-size:19px}
 #mascot .face{font-size:44px}#mascot .bub{display:none}
}


/* ===== Level map & progression ===== */
.lmap{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;padding:4px 0 12px}
.lpath{width:100%;display:flex;flex-direction:column;gap:10px;position:relative}
.lnode{position:relative;display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:#123a7a;border:5px solid #ffc400;border-radius:24px;background:linear-gradient(#fff8d6,#ffe9a0);padding:10px 16px;cursor:pointer;box-shadow:0 6px 0 #c98a00,0 10px 16px rgba(0,0,0,.22);text-align:left}
@media (max-height:860px){.ltrophy{font-size:clamp(40px,7vw,72px)}.lpath{gap:8px}.lnode{padding:8px 14px}}
.lnode:active{transform:translateY(3px)}
.lnode .num{width:clamp(54px,9vw,72px);height:clamp(54px,9vw,72px);border-radius:50%;background:linear-gradient(#ffe45c,#ffb800);display:flex;align-items:center;justify-content:center;font-size:clamp(26px,4.5vw,36px);box-shadow:0 4px 0 #c77800;flex:none}
.lnode .info{flex:1;min-width:0}
.lnode .nm{font-size:clamp(22px,3.6vw,32px);line-height:1.1}
.lnode .sub{font-size:clamp(14px,2.2vw,20px);color:#2f86e8}
.lnode .stars{font-size:clamp(22px,3.5vw,30px);letter-spacing:2px;flex:none}
.lnode.locked{filter:grayscale(.85);opacity:.8;cursor:default;box-shadow:0 7px 0 #888}
.lnode.locked .num{background:#ccc;box-shadow:0 4px 0 #888}
.lnode .lk{position:absolute;top:8px;right:14px;font-size:28px}
.lnode.done{border-color:#2ecc40;background:linear-gradient(#e9ffe9,#c8f7c8)}
.ltrophy{font-size:clamp(64px,12vw,110px);filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:bob 2s ease-in-out infinite}
.ltrophy.dim{filter:grayscale(1) opacity(.35);animation:none}
.room .trophy{position:absolute;top:6px;left:10px;font-size:28px}
.failbox{text-align:center;color:#fff;max-width:720px}
.failbox h1{font-size:clamp(36px,8vw,64px);color:#ffd21f;text-shadow:0 4px 0 #b8560a;margin:8px}
.choices.four{grid-template-columns:repeat(2,1fr)}
body.onmap #mascot{display:none}
body.onmap main{padding-bottom:16px}
body.onmap .ltrophy{font-size:clamp(36px,6vw,64px);margin:0}
@media (orientation:landscape) and (min-width:800px){.choices.four{grid-template-columns:repeat(4,1fr)}.lpath{max-width:820px}}

/* ===== Bible Library ===== */
.room.bible{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,30px);background:linear-gradient(135deg,#fff3d1,#ffd98a);padding:12px 16px}
.room.bible .em{font-size:clamp(54px,9vw,90px)}.room.bible .txt{text-align:left}
.room.bible .new{position:absolute;top:-14px;right:18px;background:#e8261c;color:#fff;border-radius:999px;padding:4px 14px;font-size:clamp(14px,2vw,20px);box-shadow:0 4px 0 #a3150c;transform:rotate(4deg)}
.shelf{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:end;padding:20px 18px 34px;background:linear-gradient(#b5773a,#8a4f1f);border:6px solid #5a300f;border-radius:28px;box-shadow:0 8px 0 #3e2009,0 14px 22px rgba(0,0,0,.25),inset 0 -20px 0 #5a300f}
.book{position:relative;font:inherit;color:#123a7a;cursor:pointer;background:#fff8d6;border:5px solid #ffc400;border-radius:18px;padding:7px;box-shadow:0 6px 0 #c98a00;display:flex;flex-direction:column;gap:6px;text-align:center}
.book.feat{grid-column:span 2}
.book .cv{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.book .cv img{width:100%;height:100%;object-fit:contain;display:block}
.book .bt{font-size:clamp(15px,2.3vw,26px);line-height:1.1}
.book .bs{font-size:clamp(13px,1.9vw,20px);color:#2f86e8}
.book.locked{cursor:default;filter:grayscale(.75);opacity:.8;box-shadow:0 6px 0 #888}
.book.locked .cv{background:linear-gradient(#cfe6ff,#9cc8f5);font-size:clamp(36px,6vw,64px)}
.book.locked .lock{position:absolute;top:6px;right:8px;font-size:clamp(20px,3vw,30px)}
.book.locked .bs{color:#666}
@media (orientation:portrait){.shelf{grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 12px 28px}.book.feat{grid-column:1/-1}}
body.reading #mascot{display:none}body.reading main{padding-bottom:16px}
.reader{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.bpage{position:relative;flex:none;width:min(100%,calc((100vh - 200px)*16/9));width:min(100%,calc((100dvh - 200px)*16/9));border:6px solid #ffc400;border-radius:22px;overflow:hidden;background:#123a7a;box-shadow:0 8px 0 #c98a00,0 14px 26px rgba(0,0,0,.3);touch-action:pan-y;perspective:1400px}
.bpage img{width:100%;height:auto;aspect-ratio:16/9;display:block;pointer-events:none;-webkit-user-drag:none;transform-origin:left center}
.bpage.outL img{animation:outL .2s ease-in forwards}.bpage.outR img{animation:outR .2s ease-in forwards}
.bpage.inR img{animation:inR .28s ease-out}.bpage.inL img{animation:inL .28s ease-out}
@keyframes outL{to{transform:rotateY(-70deg);opacity:.2}}@keyframes outR{to{transform:translateX(40%) rotateY(30deg);opacity:0}}
@keyframes inR{from{transform:translateX(35%) rotateY(25deg);opacity:0}}@keyframes inL{from{transform:rotateY(-70deg);opacity:.2}}
.rctl{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:nowrap;width:100%;max-width:900px}
.rctl .nav{min-width:clamp(104px,20vw,190px);min-height:64px}
.rctl .nav:disabled{opacity:.35;filter:grayscale(1)}
.rctl .say{width:64px;height:64px;font-size:32px}
@media (orientation:portrait) and (max-width:600px){.rctl .nav{min-width:118px;font-size:22px;padding:10px 12px}.rctl .pill{font-size:16px}}
@media (max-height:520px){.reader{display:grid;grid-template-columns:auto auto auto;grid-template-areas:"prev page next" "cnt page say";justify-content:center;align-items:center;gap:8px 12px}
 .bpage{grid-area:page;width:min(calc(100vw - 280px),calc((100vh - 92px)*16/9))}.rctl{display:contents}
 #bprev{grid-area:prev;align-self:end}#bnext{grid-area:next;align-self:end}#bcount{grid-area:cnt;align-self:start;justify-self:center}#bsay{grid-area:say;align-self:start;justify-self:center}
 .rctl .nav{min-width:110px;min-height:54px;font-size:20px;padding:8px}.rctl .say{width:48px;height:48px;font-size:24px}}
.btext{display:none;white-space:pre-line;background:#fff;border:5px solid #ffc400;border-radius:24px;box-shadow:0 6px 0 #c98a00;padding:14px 18px;font-size:clamp(22px,5.6vw,30px);line-height:1.25;text-align:center;width:100%;max-width:600px}
@media (orientation:portrait) and (max-width:700px){.btext:not(:empty){display:block}}
.bquiz .opt{min-height:clamp(64px,10vh,96px)}

/* ===== Level 4 room twists ===== */
.mute{width:52px;height:52px;min-width:52px;border-radius:50%;padding:0;font-size:26px;display:flex;align-items:center;justify-content:center;flex:none}
.mute.off{filter:grayscale(1);opacity:.75}
@media (orientation:portrait) and (max-width:600px){.mute{width:44px;height:44px;min-width:44px;font-size:21px}}
body.l4 #mascot{display:none}
body.l4 main{padding-bottom:14px}
.l4hint{color:#fff;font-size:clamp(14px,2.2vw,20px);text-shadow:0 2px 3px rgba(0,0,0,.4);margin:2px 0 8px;text-align:center}
.dragc{touch-action:none;cursor:grab}
.dragc img,.hid img,.bbl img,.mat img,.zone img{pointer-events:none;-webkit-user-drag:none;user-drag:none}
.dragc.lift{position:relative;z-index:30;cursor:grabbing;transition:none!important;box-shadow:0 18px 28px rgba(0,0,0,.35)!important}
.gone{visibility:hidden}
/* Kitchen: Set the Table */
.tabletop{position:relative;width:100%;max-width:820px;display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,40px);padding:26px 16px 16px;border:8px solid #8a4f1f;border-radius:30px;background:repeating-conic-gradient(#ff7a7a 0 25%,#fff 0 50%) 0 0/44px 44px;box-shadow:0 10px 0 #5a300f,0 16px 24px rgba(0,0,0,.28);margin-top:10px}

  const opts=shuffle([{k:step.ok,ok:1},...shuffle(step.distract).slice(0,4).map(k=>({k,ok:0}))]);
  const box=$('#mopts'); if(!box)return;
  box.innerHTML=opts.map(o=>`<button class="mopt" data-ok="${o.ok}" aria-label="choice"><img src="${MORNING_IMG}opts/${o.k}.jpg" alt=""></button>`).join('');
  box.querySelectorAll('.mopt').forEach(b=>b.onclick=()=>pickMOpt(b,i));
}
function pickMOpt(b,i){
  if(b.disabled)return;
  const step=MORNING[i];
  if(b.dataset.ok==='1'){
    sfx.right(); b.classList.add('ok');
    main.querySelectorAll('.mopt').forEach(x=>x.disabled=true);
    const r=b.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,['✨','⭐','🌟','💛']);
    confetti(40);
    setTimeout(()=>go('mstep',{i}),700);
  } else {
    sfx.wrong(); b.classList.add('no'); b.disabled=true;
    say(step.wrong);
    setTimeout(()=>b.classList.remove('no'),500);
  }
}

function mPauseVids(){main.querySelectorAll('video.mvid').forEach(v=>{try{v.pause();v.removeAttribute('src');v.load()}catch(e){}})}
function mSceneHTML(step,alt){
  const a=alt||step.title||'';
  const still=`<img class="mstill" src="${MORNING_IMG}${step.img}" alt="${a}">`;
  if(step.vid){
    return still+`<video class="mvid" muted autoplay loop playsinline preload="auto" poster="${MORNING_IMG}${step.img}" aria-label="${a}">
      <source src="${MORNING_IMG}${step.vid}.webm" type="video/webm">
      <source src="${MORNING_IMG}${step.vid}.mp4" type="video/mp4">
    </video>`;
  }
  return `<img src="${MORNING_IMG}${step.img}" alt="${a}">`;
}
function mArmVidFallback(){
  const v=main.querySelector('video.mvid'); if(!v)return;
  // Keep still visible until we have a real playing frame
  v.style.opacity='0';
  const hide=()=>{if(!v||v.dataset.fb)return; v.dataset.fb='1'; v.style.display='none'; v.style.opacity='0'; try{v.pause()}catch(e){}};
  const reveal=()=>{if(v.dataset.fb)return; if(v.videoWidth>0) v.style.opacity='1'};
  v.addEventListener('error',hide);
  v.querySelectorAll('source').forEach(s=>s.addEventListener('error',hide));
  v.addEventListener('playing',reveal);
  v.addEventListener('loadeddata',()=>{if(v.videoWidth>0) reveal()});
  const tryPlay=()=>{if(v.dataset.fb)return; const p=v.play(); if(p&&p.catch)p.catch(hide)};
  if(v.readyState>=2) tryPlay(); else {v.addEventListener('loadeddata',tryPlay,{once:true}); v.addEventListener('canplay',tryPlay,{once:true});}
  [800,1800,3000].forEach(ms=>setTimeout(()=>{
    if(v.dataset.fb)return;
    if(v.error||v.networkState===3||v.readyState<2||v.videoWidth===0) hide();
    else reveal();
  },ms));
}

function mstep(a){
  const i=a.i|0; const step=MORNING[i]; const tok=++mTok;
  mPauseVids();
  state={m:i, seen:[...(state.seen||[]), step.img]};
  $('#title').textContent='☀️ '+step.title;
  main.innerHTML=`<div class="mstage"><div class="mscene" id="msc">${mSceneHTML(step)}</div><div class="msparks">${mSparks(18)}</div>
  <div class="mui" id="mui">${mProg(i)}<div class="mq"><span>${step.narr}</span><button class="say">🔊</button></div>
  <button class="btn" id="mnext" style="opacity:0;pointer-events:none">Next ➜</button></div></div>`;
  mShowUI(); mArmVidFallback();
  const armNext=(fn)=>{const btn=$('#mnext'); if(btn&&tok===mTok){btn.style.opacity=1; btn.style.pointerEvents='auto'; btn.onclick=()=>{if(tok!==mTok)return; sfx.tap(); fn()}}};
  const advance=()=>{if(tok!==mTok)return; if(i+1<MORNING.length) go('morningAsk',{i:i+1}); else go('mwin')};
  if(step.prayer){
    say([step.narr]);
    setTimeout(()=>{ if(tok!==mTok)return;
      const stage=main.querySelector('.mstage'); if(!stage)return;
      const note=document.createElement('div'); note.className='mnote'; note.id='mnote';
      note.innerHTML=`<div>${step.prayer}</div>`; stage.appendChild(note);
      say([step.prayer]);
      setTimeout(()=>{ if(tok!==mTok)return;
        note.innerHTML=`<div>${step.prayer}</div><div class="amen">Amen!</div>`;
        say(['Amen!']); sfx.pop(); confetti(50);
        setTimeout(()=>{ if(tok!==mTok)return;
          const sc=main.querySelector('#msc'); const img=sc&&sc.querySelector('img');
          if(step.img2&&img){ mPauseVids(); sc.querySelectorAll('video.mvid').forEach(v=>{v.dataset.fb='1';v.style.display='none'}); img.src=MORNING_IMG+step.img2; sc.classList.remove('xfade'); void sc.offsetWidth; sc.classList.add('xfade'); }
          note.remove(); armNext(advance);
        },1400);
      }, 3800);
    }, 900);
    main.querySelector('.say').onclick=()=>say([step.narr, step.prayer, 'Amen!']);
  } else {
    say([step.narr]);
    main.querySelector('.say').onclick=()=>say(step.narr);
    setTimeout(()=>armNext(advance), 1100);
  }
}
function morningAsk(a){
  const i=a.i|0; const step=MORNING[i]; state={...state, m:i};
  $('#title').textContent="☀️ Mia's Morning Routine";
  const prev=MORNING[Math.max(0,i-1)];
  main.innerHTML=`<div class="mstage"><div class="mscene"><img src="${MORNING_IMG}${prev.img}" alt=""></div><div class="msparks">${mSparks()}</div>
  <div class="mui" id="mui">${mProg(i)}<div class="mq"><span>${step.ask}</span><button class="say">🔊</button></div>
  <div class="mopts" id="mopts"></div></div></div>`;
  const kick=()=>{mShowUI(); say([step.ask]); main.querySelector('.say').onclick=()=>say(step.ask); renderMOpts(i)};
  setTimeout(kick,100);
}
function mwin(){
  clearInterval(mSlideTimer); mTok++;
  $('#title').textContent='🏆 Morning Champion!';
  const shots=['wake.jpg',...MORNING.map(s=>s.img),'champion.jpg'];
  main.innerHTML=`<div class="mstage mwin">
  <div class="mscene"><img src="${MORNING_IMG}champion.jpg" alt="Morning Champion"></div>
  <div class="mbadge" id="mbadge">
    <div class="seal"><div class="em">☀️</div><div class="tx">Morning Champion</div></div>
    <h1>Morning Champion!</h1>
    <div class="greetpill">Good morning!</div>
  </div>
  <div class="mslidewrap"><div class="mslide" id="mslide">${shots.map((s,i)=>`<img src="${MORNING_IMG}${s}" class="${i===0?'on':''}" alt="">`).join('')}</div></div>
  <div class="mwinbtns">
    <button class="btn" id="magain">🔁 Play Again</button>
    <button class="btn" id="mhomebtn">🏠 Home</button>
  </div></div>`;
  // Settle badge fully opaque after pop-in, then cycle montage
  setTimeout(()=>{const b=$('#mbadge'); if(b) b.classList.add('settled')},650);
  let si=0; const slides=[...main.querySelectorAll('#mslide img')];
  // Hold first slide solid for 2.2s so screenshots aren't mid-crossfade, then cycle
  mSlideTimer=setInterval(()=>{
    if(!slides.length)return;
    slides[si].classList.remove('on');
    si=(si+1)%slides.length;
    slides[si].classList.add('on');
  },2200);
  sfx.win(); confetti(90);
  for(let i=0;i<3;i++) setTimeout(()=>burst(innerWidth*(.2+.25*i), innerHeight*.22, ['⭐','✨','☀️','🌟']), i*220);
  say(['Good morning!','You are a Morning Champion!','What a wonderful morning!'],1);
  $('#magain').onclick=()=>{clearInterval(mSlideTimer);sfx.tap();go('morning')};
  $('#mhomebtn').onclick=()=>{clearInterval(mSlideTimer);sfx.tap();go('home')};
}

/* Offline Bible books: cache the whole book when it is opened, and prefetch every book (incl. newly added ones) whenever online. */
function swPost(m){if(!('serviceWorker' in navigator))return false;const c=navigator.serviceWorker.controller;if(c){c.postMessage(m);return true}navigator.serviceWorker.ready.then(r=>r.active&&r.active.postMessage(m)).catch(()=>{});return true}
function cacheBook(slug){if(navigator.onLine!==false)swPost({type:'cacheBook',slug,voice:vSet.id})}
function prefetchBooks(){if(navigator.onLine!==false)swPost({type:'cacheBooks',voice:vSet.id})}
addEventListener('load',()=>setTimeout(prefetchBooks,4000));addEventListener('online',()=>setTimeout(prefetchBooks,1500));setInterval(prefetchBooks,30*60*1000);
if(navigator.serviceWorker)navigator.serviceWorker.addEventListener('controllerchange',()=>setTimeout(prefetchBooks,2500));
